name: textin
description: "messanger app for nakupenda"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  envied: ^1.1.1
  flutter_riverpod: ^3.0.0
  get_it: ^9.2.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  http: ^1.4.0
  socket_io_client: ^3.1.3
  cached_network_image: ^3.4.1
  just_audio: ^0.10.4
  record: ^6.1.1
  flutter_svg: ^2.1.0
  path_provider: ^2.1.5
  intl: any
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  json_annotation: ^4.9.0
  phosphor_flutter: ^2.1.0
  flutter_twilio_commkit: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  envied_generator: ^1.1.1
  json_serializable: ^6.11.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  fake_async: ^1.3.3

dependency_overrides:
  # Vendored from the Nakupenda app: upstream pins
  # com.twilio:conversations-android:2.1.2, which was never published to a
  # public Maven repo. These copies stub the unused chat feature so the Video
  # SDK used for whisper live audio compiles.
  # Vendored without its prebuilt video call screen, the only part that needs
  # flutter_riverpod 3 (this app is on 2.x).
  flutter_twilio_commkit:
    path: third_party/flutter_twilio_commkit
  flutter_twilio_commkit_android:
    path: third_party/flutter_twilio_commkit_android
  flutter_twilio_commkit_ios:
    path: third_party/flutter_twilio_commkit_ios

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/textin_launcher_icon.png
  adaptive_icon_background: "#EC1F25"
  adaptive_icon_foreground: assets/images/textin_mark_white.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/textin_logo.png
  color_dark: "#0F1115"
  image_dark: assets/images/textin_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/textin_logo.png
    color_dark: "#0F1115"
    image_dark: assets/images/textin_logo.png
