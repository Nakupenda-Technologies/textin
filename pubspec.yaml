name: textin
description: "messanger app for nakupenda"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  envied: ^1.1.1
  flutter_riverpod: ^2.6.1
  get_it: ^9.2.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  http: ^1.4.0
  socket_io_client: ^3.1.3
  cached_network_image: ^3.4.1
  just_audio: ^0.10.4
  record: ^6.1.1
  flutter_svg: ^2.1.0
  path_provider: ^2.1.5
  intl: any
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  envied_generator: ^1.1.1
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/
